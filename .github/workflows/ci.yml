name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create .env
        run: cp .env.example .env

      - name: Start backend
        run: |
          docker compose up -d postgres-auth postgres-files postgres-prefs redis rabbitmq
          sleep 20
          docker compose up -d auth-service file-service preferences-service gateway
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "gateway up after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "gateway did not become healthy in time" >&2
          docker compose logs --tail 100
          exit 1

      - name: Run API tests
        working-directory: testing-framework
        run: mvn test -DsuiteXmlFile=src/test/resources/testng-parallel-classes.xml

      - name: Tear down
        if: always()
        run: docker compose down -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: testing-framework/target/surefire-reports/
