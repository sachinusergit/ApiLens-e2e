server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/apilens_auth}
    username: ${SPRING_DATASOURCE_USERNAME:apilens}
    password: ${SPRING_DATASOURCE_PASSWORD:apilens_dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: filesystem:/app/db/migrations/auth,classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_secret_at_least_64_chars_long_0123456789abcdef}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  email-change:
    max-changes: ${EMAIL_CHANGE_MAX:1}
    window-hours: ${EMAIL_CHANGE_WINDOW_HOURS:24}

logging:
  level:
    com.apilens: INFO
    org.springframework.security: INFO
