server:
  port: 8084

spring:
  application:
    name: file-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/apilens_files}
    username: ${SPRING_DATASOURCE_USERNAME:apilens}
    password: ${SPRING_DATASOURCE_PASSWORD:apilens_dev}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: filesystem:/app/db/migrations/files,classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  storage:
    root: ${APP_STORAGE_ROOT:/app/data/files}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_secret_at_least_64_chars_long_0123456789abcdef}

logging:
  level:
    com.apilens: INFO
