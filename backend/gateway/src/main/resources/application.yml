server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: file-service
          uri: ${FILE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=1
        - id: preferences-service
          uri: ${PREFS_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/preferences/**,/api/confirmations/**,/api/notifications/**,/api/banners/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_secret_at_least_64_chars_long_0123456789abcdef}
  loadtest:
    key: ${LOAD_TEST_KEY:loadtest_dev_bypass_key}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.apilens: INFO
