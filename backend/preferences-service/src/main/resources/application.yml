server:
  port: 8085

spring:
  application:
    name: preferences-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/apilens_prefs}
    username: ${SPRING_DATASOURCE_USERNAME:apilens}
    password: ${SPRING_DATASOURCE_PASSWORD:apilens_dev}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: filesystem:/app/db/migrations/prefs,classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_secret_at_least_64_chars_long_0123456789abcdef}

logging:
  level:
    com.apilens: INFO
